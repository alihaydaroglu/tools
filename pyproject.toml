[project]
name = "ali-tools"
version = "0.1.0"
description = "Reusable scientific helper functions for analysis, PCA, plotting, and utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pandas>=2.0",
  "imageio>=2.31",
  "pillow>=10.0",
]

[tool.uv]
dev-dependencies = []

[tool.setuptools.packages.find]
where = [".."]
include = ["tools*"]
